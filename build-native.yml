name: Compilar CuraPro CL (Windows y Android)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Generar APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias, empaquetar librerías offline y sincronizar Android
        run: |
          npm install
          npm run vendor
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: CuraPro-CL-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-pc:
    name: Generar Instalador (Windows)
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias, empaquetar librerías offline y compilar EXE
        run: |
          npm install
          npm run build:win

      - name: Subir EXE
        uses: actions/upload-artifact@v4
        with:
          name: CuraPro-CL-Windows-EXE
          path: dist/*.exe
